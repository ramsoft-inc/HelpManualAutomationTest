name: Autosnap Enhanced Flow

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments to pass to AutoSnap/test-enhanced-flow.ci.js (e.g., --mode ui_change --file docs/...)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: autosnap-enhanced-flow-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    # Run if manually dispatched, or if a PR comment contains the trigger keyword
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/autosnap')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Get PR info (issue_comment only)
        if: ${{ github.event_name == 'issue_comment' }}
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('ref', `refs/pull/${prNumber}/head`);
            core.setOutput('baseRef', pr.base.ref);
            core.setOutput('headSha', pr.head.sha);

      - name: Checkout PR head (issue_comment)
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0

      - name: Checkout (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install root dependencies
        run: |
          corepack enable
          if [ -f yarn.lock ]; then
            echo "Using yarn at repo root"
            yarn install --frozen-lockfile
          else
            echo "Using npm at repo root"
            npm ci || npm install
          fi

      - name: Install AutoSnap dependencies
        working-directory: AutoSnap
        run: |
          if [ -f yarn.lock ]; then
            echo "Using yarn in AutoSnap"
            yarn install --frozen-lockfile
          else
            echo "Using npm in AutoSnap"
            npm ci || npm install
          fi

      - name: Install tracewrightt dependencies
        working-directory: AutoSnap/tracewrightt
        run: |
          if [ -f yarn.lock ]; then
            echo "Using yarn in tracewrightt"
            yarn install --frozen-lockfile
          else
            echo "Using npm in tracewrightt"
            npm ci || npm install
          fi

      - name: Install Playwright (Chromium) and system deps
        working-directory: AutoSnap
        run: |
          npx playwright install --with-deps chromium

      - name: Prepare CI copy of script with CI-safe tweaks
        run: |
          cp AutoSnap/test-enhanced-flow.js AutoSnap/test-enhanced-flow.ci.js
          # Use Chromium channel on Linux CI instead of Chrome
          sed -i "s/channel: 'chrome'/channel: 'chromium'/" AutoSnap/test-enhanced-flow.ci.js
          # Run headless in CI
          sed -i "s/headless: false/headless: true/" AutoSnap/test-enhanced-flow.ci.js
          # Fix hardcoded Windows fallback paths to repo-relative docs path
          sed -i "s#C:/Users/Rohith.MR/test/HelpManualAutomationTest/docs/1-Getting-Started/addorg.md#docs/1-Getting-Started/addorg.md#g" AutoSnap/test-enhanced-flow.ci.js

      - name: Parse args from PR comment or dispatch input
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            let args = '';
            if (context.eventName === 'workflow_dispatch') {
              args = core.getInput('args') || '';
            } else if (context.eventName === 'issue_comment') {
              const body = context.payload.comment.body || '';
              // Accept lines like: /autosnap --mode ui_change --file docs/...
              const m = body.match(/^\/autosnap\s*(.*)$/mi);
              if (m && m[1]) args = m[1].trim();
            }
            core.setOutput('args', args);

      - name: Run Autosnap Enhanced Flow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          echo "Args: ${{ steps.parse.outputs.args }}"
          node AutoSnap/test-enhanced-flow.ci.js ${{ steps.parse.outputs.args }} | tee autosnap-ci-output.log

      - name: Upload artifacts (logs and outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosnap-enhanced-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            autosnap-ci-output.log
            enhanced-flow-log.txt
            token_usage_summary.txt
            changed-files-*.txt
            api_log_backup.json
            api_logs/**
            ai_thinking_log.txt
          if-no-files-found: ignore

      - name: Comment back on PR
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `✅ Autosnap Enhanced Flow run started.`,
              ``,
              `• Args: \`${{ steps.parse.outputs.args }}\``,
              `• Run: ${runUrl}`,
            ].join('\n');
            await github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });


