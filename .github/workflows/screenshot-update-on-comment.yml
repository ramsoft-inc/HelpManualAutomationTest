name: Screenshot Update on PR Comment

on:
  issue_comment:
    types: [created]

jobs:
  update-screenshots:
    # Only run on pull request comments that contain the trigger phrase
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/update-screenshots')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            return {
              head_ref: pullRequest.head.ref,
              head_sha: pullRequest.head.sha,
              base_ref: pullRequest.base.ref
            };

      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.pr.outputs.result).head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Setup Yarn (for projects using yarn.lock)
        run: |
          # Enable yarn if needed for projects with yarn.lock
          if [ -f "yarn.lock" ]; then
            echo "📦 Yarn lock file detected, enabling yarn"
            npm install -g yarn
            yarn --version
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # Function to install dependencies with GitHub Actions environment considerations
          install_deps() {
            local dir=$1
            echo "📦 Installing dependencies in $dir..."
            
            # Use absolute path to avoid directory issues in GitHub Actions
            local abs_dir=$(cd "$dir" && pwd)
            cd "$abs_dir"
            
            # Check what package manager files exist
            local has_yarn_lock=false
            local has_package_lock=false
            
            if [ -f "yarn.lock" ]; then
              has_yarn_lock=true
              echo "✅ Found yarn.lock in $abs_dir"
            fi
            
            if [ -f "package-lock.json" ]; then
              has_package_lock=true
              echo "✅ Found package-lock.json in $abs_dir"
            fi
            
            # Install dependencies based on what's available in GitHub Actions
            if [ "$has_yarn_lock" = true ] && command -v yarn >/dev/null 2>&1; then
              echo "🧶 Using yarn install (frozen lockfile)"
              yarn install --frozen-lockfile || {
                echo "⚠️ Frozen lockfile failed, trying regular yarn install"
                yarn install --ignore-engines || yarn install
              }
            elif [ "$has_package_lock" = true ]; then
              echo "📦 Using npm ci"
              npm ci
            else
              echo "⚠️ No lock file or using fallback npm install"
              npm install
            fi
            
            # Return to original directory
            cd "$GITHUB_WORKSPACE"
          }
          
          # Install root dependencies
          install_deps "."
          
          # Install AutoSnap dependencies (where enhanced-run-script.js is located)
          install_deps "AutoSnap"
          
          # Install Python dependencies
          echo "🐍 Installing Python dependencies..."
          cd "$GITHUB_WORKSPACE/AutoSnap"
          pip install -r requirements.txt
          
          # Install tracewrightt dependencies (TypeScript compilation)
          echo "🔨 Installing tracewrightt dependencies..."
          cd "$GITHUB_WORKSPACE/AutoSnap/tracewrightt"
          
          # Check what package manager to use for tracewrightt
          if [ -f "yarn.lock" ] && command -v yarn >/dev/null 2>&1; then
            echo "🧶 Using yarn for tracewrightt"
            # First try with frozen lockfile, then fallback to regular install
            yarn install --frozen-lockfile || {
              echo "⚠️ Frozen lockfile failed, trying regular yarn install"
              yarn install --ignore-engines || yarn install
            }
          elif [ -f "package-lock.json" ]; then
            echo "📦 Using npm for tracewrightt"
            npm ci || npm install
          else
            echo "⚠️ Using npm install as fallback for tracewrightt"
            npm install
          fi
          
          # Pre-compile TypeScript to avoid runtime compilation issues
          echo "🔨 Building TypeScript..."
          
          # Verify rollup dependencies are installed
          echo "🔍 Checking rollup dependencies..."
          ls -la node_modules/@rollup/ 2>/dev/null || {
            echo "⚠️ Missing rollup dependencies, installing manually"
            npm install @rollup/plugin-node-resolve @rollup/plugin-commonjs @rollup/plugin-terser || true
          }
          
          # Check if we can build TypeScript
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            npm run build || {
              echo "⚠️  TypeScript compilation failed, will use ts-node fallback"
              echo "📋 Available node_modules in tracewrightt:"
              ls -la node_modules/ | head -10 || echo "No node_modules found"
            }
          else
            echo "⚠️  No build script found, will use ts-node"
          fi
          
          # Install Playwright browsers in AutoSnap directory
          echo "🎭 Installing Playwright browsers..."
          cd "$GITHUB_WORKSPACE/AutoSnap"
          npx playwright install chromium --with-deps || {
            echo "⚠️ Playwright install failed, trying without --with-deps"
            npx playwright install chromium
          }

      - name: Extract command parameters
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body }}"
          echo "Original comment: $COMMENT"
          
          # Extract file patterns from comment
          # Examples:
          # /update-screenshots docs/5-Document-Viewer/document_explorer.md
          # /update-screenshots docs/*/login.md  
          # /update-screenshots all
          # /update-screenshots mode:ui_change docs/specific-file.md
          
          # Extract mode (default to ui_change) - fixed regex
          MODE=$(echo "$COMMENT" | grep -oE 'mode:[a-zA-Z_]+' | cut -d':' -f2 || echo "ui_change")
          
          # Extract files pattern - improved parsing
          FILES=$(echo "$COMMENT" | sed 's|\/update-screenshots||' | sed 's|mode:[a-zA-Z_]*||' | xargs)
          
          if [ -z "$FILES" ] || [ "$FILES" = "all" ]; then
            FILES="docs/**/*.md"
          fi
          
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Processing mode: $MODE"
          echo "Processing files: $FILES"

      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'rocket'
            });

      - name: Comment start notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Screenshot update started!**
              
              **Triggered by:** @${{ github.event.comment.user.login }}
              **Mode:** \`${{ steps.extract.outputs.mode }}\`
              **Files:** \`${{ steps.extract.outputs.files }}\`
              **Branch:** \`${{ fromJson(steps.pr.outputs.result).head_ref }}\`
              
              ⏳ Processing... This may take a few minutes.
              
              [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });


      - name: Create temporary changed files list
        run: |
          # Ensure we're in the right directory with absolute path
          cd "$GITHUB_WORKSPACE/AutoSnap"
          FILES="${{ steps.extract.outputs.files }}"
          
          # Create a temporary file with the files to process
          echo "📁 Creating temporary file list for: $FILES"
          
          if [ "$FILES" = "docs/**/*.md" ] || [ "$FILES" = "all" ]; then
            # Process all markdown files in docs - use paths relative to AutoSnap directory
            echo "🔍 Finding all markdown files in docs directory..."
            find "$GITHUB_WORKSPACE/docs" -name "*.md" -type f | sed "s|$GITHUB_WORKSPACE/|../|" > changed_files_temp.txt
          else
            # Process specific files/patterns - handle folders and individual files
            echo "📝 Processing specific files/folders: $FILES"
            > changed_files_temp.txt
            
            # Handle both space-separated and comma-separated files/folders
            echo "$FILES" | tr ' ,' '\n' | grep -v '^$' | while IFS= read -r item; do
              # Remove leading/trailing whitespace
              item=$(echo "$item" | xargs)
              [ -z "$item" ] && continue
              
              # Check if item is a directory (ends with / or is an existing directory)
              if [[ "$item" == */ ]] || [ -d "$GITHUB_WORKSPACE/$item" ]; then
                # Remove trailing slash for consistency
                folder_path="${item%/}"
                echo "📁 Processing folder in translation/default mode: $folder_path"
                echo "ℹ️  Translation mode processes files that contain actual images only"
                
                # Recursively find all markdown files in the folder (exactly like test-enhanced-flow.js)
                if [ -d "$GITHUB_WORKSPACE/$folder_path" ]; then
                  echo "🔍 Recursively finding all .md and .mdx files in: $GITHUB_WORKSPACE/$folder_path"
                  
                  # Create a function to recursively find markdown files (replicating findMarkdownFiles)
                  find_markdown_files() {
                    local dir="$1"
                    find "$dir" -type f \( -name "*.md" -o -name "*.mdx" \) 2>/dev/null || true
                  }
                  
                  # Get all markdown files
                  all_markdown_files=$(find_markdown_files "$GITHUB_WORKSPACE/$folder_path")
                  markdown_count=$(echo "$all_markdown_files" | grep -c . || echo "0")
                  
                  echo "📄 Found $markdown_count markdown files in language folder"
                  
                  if [ "$markdown_count" -gt 0 ]; then
                    # Filter files to only include those with actual images (replicating hasActualImages check)
                    echo "🔍 Filtering files to only include those with actual images..."
                    
                    # Use a temporary file to store files with images to avoid subshell variable issues
                    files_with_images_temp="$GITHUB_WORKSPACE/files_with_images_temp.txt"
                    skipped_files_temp="$GITHUB_WORKSPACE/skipped_files_temp.txt"
                    > "$files_with_images_temp"
                    > "$skipped_files_temp"
                    
                    # Process each markdown file
                    while IFS= read -r md_file; do
                      [ -z "$md_file" ] && continue
                      
                      # Check if file contains actual image references (replicating hasActualImages function)
                      if grep -qE '!\[.*?\]\(.*?\.(png|jpg|jpeg|gif|svg|webp|bmp)\)' "$md_file" 2>/dev/null; then
                        # File has actual images - add to processing list
                        echo "$md_file" | sed "s|$GITHUB_WORKSPACE/|../|" >> changed_files_temp.txt
                        echo "$md_file" >> "$files_with_images_temp"
                        echo "✅ File has images: $(basename "$md_file")"
                      else
                        echo "$md_file" >> "$skipped_files_temp"
                        echo "⏭️  File without images (skipped): $(basename "$md_file")"
                      fi
                    done <<< "$all_markdown_files"
                    
                    # Count the results
                    files_with_images=$(wc -l < "$files_with_images_temp" 2>/dev/null || echo "0")
                    skipped_files=$(wc -l < "$skipped_files_temp" 2>/dev/null || echo "0")
                    
                    echo "📄 Files with actual images: $files_with_images"
                    echo "⏭️  Files without images (skipped): $skipped_files"
                    
                    # Clean up temp files
                    rm -f "$files_with_images_temp" "$skipped_files_temp"
                    
                    if [ "$files_with_images" -eq 0 ]; then
                      echo "⚠️ No files with actual images found in folder: $folder_path"
                      echo "ℹ️ Translation mode only processes files that contain actual image references"
                    else
                      echo "✅ Translation mode processing will handle $files_with_images files with images"
                    fi
                  else
                    echo "⚠️ No markdown files found in folder: $folder_path"
                  fi
                else
                  echo "⚠️ Folder not found: $folder_path"
                fi
              else
                # It's a file path - add ../ prefix for AutoSnap relative paths
                echo "../$item" >> changed_files_temp.txt
                echo "📄 Added individual file: $item"
              fi
            done
          fi
          
          # Validate files exist and convert to paths relative to AutoSnap directory
          echo "🔍 Validating files exist relative to AutoSnap directory..."
          > validated_files_temp.txt
          
          if [ -s changed_files_temp.txt ]; then
            while IFS= read -r file; do
              # Remove leading/trailing whitespace
              file=$(echo "$file" | xargs)
              
              # Skip empty lines
              [ -z "$file" ] && continue
              
              # Check if file exists using paths relative to AutoSnap directory
              if [ -f "$file" ]; then
                echo "$file" >> validated_files_temp.txt
                echo "✅ Found: $file (relative to AutoSnap/)"
              else
                echo "⚠️ File not found: $file (relative to AutoSnap/)"
                # Try absolute path for debugging
                absolute_file="$GITHUB_WORKSPACE/${file#../}"
                if [ -f "$absolute_file" ]; then
                  echo "📍 File exists at absolute path: $absolute_file"
                  echo "$file" >> validated_files_temp.txt
                else
                  echo "❌ File not found at absolute path either: $absolute_file"
                  # List what's actually in the directory for debugging
                  if [ -d "$(dirname "$absolute_file")" ]; then
                    echo "📁 Directory contents of $(dirname "$absolute_file"):"
                    ls -la "$(dirname "$absolute_file")" | head -10
                  else
                    echo "❌ Directory doesn't exist: $(dirname "$absolute_file")"
                  fi
                fi
              fi
            done < changed_files_temp.txt
          else
            echo "⚠️ No files were found in the initial processing step"
          fi
          
          # Use validated files
          mv validated_files_temp.txt changed_files_temp.txt
          
          echo "📋 Final files to process:"
          cat changed_files_temp.txt
          
          # Check if we have any files to process
          if [ ! -s changed_files_temp.txt ]; then
            echo "❌ No valid files found to process!"
            echo "🔍 Debugging information:"
            echo "  - Original FILES pattern: $FILES"
            echo "  - GitHub workspace: $GITHUB_WORKSPACE"
            echo "  - Current directory: $(pwd)"
            
            # Show what directories actually exist
            echo "📁 Available directories in workspace root:"
            ls -la "$GITHUB_WORKSPACE" | grep "^d" | head -10
            
            # If it's a folder pattern, show what's in it
            if [[ "$FILES" == */ ]] || [ -d "$GITHUB_WORKSPACE/$FILES" ]; then
              folder_to_check="${FILES%/}"
              if [ -d "$GITHUB_WORKSPACE/$folder_to_check" ]; then
                echo "📁 Contents of $folder_to_check directory:"
                find "$GITHUB_WORKSPACE/$folder_to_check" -name "*.md" -type f | head -10 || echo "No .md files found"
              fi
            fi
            
            exit 1
          fi

      - name: Run enhanced screenshot flow
        env:
          GITHUB_ACTIONS: true
          GITHUB_WORKSPACE: ${{ github.workspace }}
          CURRENT_MODE: ${{ steps.extract.outputs.mode }}
          FILES_TO_PROCESS: ${{ steps.extract.outputs.files }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
          # Node.js ESM and TypeScript support (updated for Node 18+)
          NODE_OPTIONS: "--loader ts-node/esm --no-warnings --experimental-specifier-resolution=node"
          TS_NODE_ESM: true
          TS_NODE_COMPILER_OPTIONS: '{"module":"ESNext","moduleResolution":"node","allowSyntheticDefaultImports":true,"esModuleInterop":true}'
          TS_NODE_PROJECT: "./tracewrightt/tsconfig.json"
          # Add your API keys from secrets
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Ensure we're in the right directory with absolute path
          cd "$GITHUB_WORKSPACE/AutoSnap"
          
          echo "🚀 Starting enhanced screenshot update process..."
          echo "Environment: GitHub Actions"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Mode: $CURRENT_MODE"
          echo "Files to process: $FILES_TO_PROCESS"
          echo "Branch: ${{ fromJson(steps.pr.outputs.result).head_ref }}"
          
          # Debug: Show current environment
          echo "📋 Current directory: $(pwd)"
          echo "📋 Node version: $(node --version)"
          echo "📋 NPM version: $(npm --version)"
          echo "📋 Python version: $(python --version)"
          echo "📋 Files exist check:"
          ls -la enhanced-run-script.js || echo "❌ enhanced-run-script.js not found!"
          ls -la changed_files_temp.txt || echo "❌ changed_files_temp.txt not found!"
          ls -la tracewrightt/dist/ || echo "⚠️ tracewrightt/dist/ not found, will use ts-node"
          
          # Debug: Check what's actually in the compiled dist directory
          if [ -d "tracewrightt/dist/esm" ]; then
            echo "📁 Contents of tracewrightt/dist/esm:"
            find tracewrightt/dist/esm -name "*.js" | head -15
            echo "🔍 Looking for specific entry points:"
            for entry in "tracewrightt/dist/esm/tracewrightt/src/run.js" "tracewrightt/dist/esm/src/run.js" "tracewrightt/dist/esm/run.js" "tracewrightt/dist/esm/index.js"; do
              if [ -f "$entry" ]; then
                echo "✅ Found: $entry"
              else
                echo "❌ Missing: $entry"
              fi
            done
            
            # Also check for files in _virtual directory and other patterns
            echo "🔍 Checking alternative patterns:"
            for pattern in "tracewrightt/dist/esm/_virtual/index.js" "tracewrightt/dist/esm/_virtual/run.js" "tracewrightt/dist/esm/_virtual/main.js"; do
              if [ -f "$pattern" ]; then
                echo "✅ Found alternative: $pattern"
              else
                echo "❌ Missing alternative: $pattern"  
              fi
            done
            
            # Show detailed structure
            echo "📂 Full directory structure:"
            ls -la tracewrightt/dist/esm/ || echo "Cannot list esm directory"
            ls -la tracewrightt/dist/esm/_virtual/ 2>/dev/null || echo "No _virtual directory"
          else
            echo "❌ tracewrightt/dist/esm directory not found"
          fi
          
          # Debug: Check if files in changed_files_temp.txt actually exist (relative to AutoSnap/)
          echo "🔍 Verifying files in changed_files_temp.txt exist (relative to AutoSnap/):"
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "✅ File exists: $file (relative to AutoSnap/)"
            else
              echo "❌ File missing: $file (relative to AutoSnap/)"
              # Also check absolute path
              absolute_file="$GITHUB_WORKSPACE/${file#../}"
              if [ -f "$absolute_file" ]; then
                echo "✅ File exists at absolute path: $absolute_file"
              else
                echo "❌ File also missing at absolute path: $absolute_file"
              fi
            fi
          done < changed_files_temp.txt
          
          # Enhanced fix: Find the actual compiled entry point and create symlinks
          echo "🔧 Patching: Creating entry points for Tracewright"
          
          # Create index.js symlink (primary entry point)
          if [ -f "tracewrightt/dist/esm/AutoSnap/tracewrightt/src/index.js" ]; then
            echo "✅ Found actual entry point: AutoSnap/tracewrightt/src/index.js"
            ln -sf "AutoSnap/tracewrightt/src/index.js" "tracewrightt/dist/esm/index.js" 2>/dev/null || {
              echo "⚠️ Primary symlink failed, trying copy"
              cp "tracewrightt/dist/esm/AutoSnap/tracewrightt/src/index.js" "tracewrightt/dist/esm/index.js" || echo "Copy failed"
            }
          elif [ -f "tracewrightt/dist/esm/_virtual/index.js" ]; then
            echo "✅ Using virtual entry point: _virtual/index.js"
            ln -sf "_virtual/index.js" "tracewrightt/dist/esm/index.js" 2>/dev/null || {
              echo "⚠️ Fallback symlink failed, trying copy"
              cp "tracewrightt/dist/esm/_virtual/index.js" "tracewrightt/dist/esm/index.js" || echo "Copy failed"
            }
          fi
          
          # Create src/run.js symlink (alternative entry point)
          if [ -f "tracewrightt/dist/esm/AutoSnap/tracewrightt/src/run.js" ]; then
            mkdir -p "tracewrightt/dist/esm/src"
            ln -sf "../AutoSnap/tracewrightt/src/run.js" "tracewrightt/dist/esm/src/run.js" 2>/dev/null || {
              cp "tracewrightt/dist/esm/AutoSnap/tracewrightt/src/run.js" "tracewrightt/dist/esm/src/run.js" 2>/dev/null || echo "No run.js found"
            }
          fi
          
          # Force ts-node fallback due to ESM/CommonJS compatibility issues
          echo "🔧 Forcing ts-node fallback due to module compatibility issues"
          rm -f "tracewrightt/dist/esm/index.js" 2>/dev/null || true
          
          # Determine if we're processing a folder pattern and pass appropriate arguments
          if [[ "$FILES_TO_PROCESS" == */ ]] || [ -d "$GITHUB_WORKSPACE/$FILES_TO_PROCESS" ]; then
            # Folder mode - pass folder path to enhanced-run-script.js (matching test-enhanced-flow.js)
            folder_path_to_process="${FILES_TO_PROCESS%/}"
            echo "📁 Running enhanced-run-script.js in folder mode with folder: $folder_path_to_process"
            
            # Convert to absolute path for enhanced-run-script.js
            absolute_folder_path="$GITHUB_WORKSPACE/$folder_path_to_process"
            
            node enhanced-run-script.js \
              --mode "$CURRENT_MODE" \
              --folder "$absolute_folder_path" || {
              echo "❌ Enhanced screenshot update failed in folder mode"
              echo "📁 Folder path: $absolute_folder_path"
              echo "📁 Current directory contents:"
              ls -la
              echo "📁 Folder contents (if exists):"
              ls -la "$absolute_folder_path" 2>/dev/null || echo "Folder not accessible"
              exit 1
            }
          else
            # File mode - use changed files list (original behavior)
            echo "📄 Running enhanced-run-script.js in file mode with changed files list"
            
            node enhanced-run-script.js \
              --mode "$CURRENT_MODE" \
              --changed-files "changed_files_temp.txt" || {
              echo "❌ Enhanced screenshot update failed in file mode"
              echo "📁 Contents of changed_files_temp.txt:"
              cat changed_files_temp.txt || echo "Could not read changed_files_temp.txt"
              echo "📁 Current directory contents:"
              ls -la
              echo "📁 Node modules in AutoSnap:"
              ls -la node_modules/ | head -10 || echo "No node_modules found"
              exit 1
            }
          fi
          
          # Clean up temporary file
          rm -f changed_files_temp.txt

      - name: Check for changes
        id: changes
        run: |
          # Check if there are any changes in the docs directory
          if git diff --quiet docs/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in docs directory"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in docs directory"
            echo "Changed files:"
            git diff --name-only docs/
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Add all changes in docs directory
          git add docs/
          
          # Create commit with detailed message
          git commit -m "🤖 Update screenshots via GitHub Actions

          Triggered by: @${{ github.event.comment.user.login }}
          Comment: ${{ github.event.comment.html_url }}
          Mode: ${{ steps.extract.outputs.mode }}
          Files processed: ${{ steps.extract.outputs.files }}
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Auto-generated by screenshot-update-on-comment workflow"
          
          # Push changes
          git push origin ${{ fromJson(steps.pr.outputs.result).head_ref }}

      - name: Comment on success
        if: success() && steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ fromJson(steps.pr.outputs.result).head_ref }}'
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Screenshot update completed successfully!**
              
              **Summary:**
              - **Mode:** \`${{ steps.extract.outputs.mode }}\`
              - **Files processed:** \`${{ steps.extract.outputs.files }}\`
              - **Branch:** \`${{ fromJson(steps.pr.outputs.result).head_ref }}\`
              - **Commit:** [\`${commit.sha.substring(0, 7)}\`](${commit.html_url})
              
              **Changes committed:**
              ${process.env.GITHUB_WORKSPACE ? '- Screenshots updated in docs directory' : ''}
              
              The PR has been updated with the new screenshots. You can now review the changes.
              
              [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Comment on success (no changes)
        if: success() && steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Screenshot update completed successfully!**
              
              **Summary:**
              - **Mode:** \`${{ steps.extract.outputs.mode }}\`
              - **Files processed:** \`${{ steps.extract.outputs.files }}\`
              - **Branch:** \`${{ fromJson(steps.pr.outputs.result).head_ref }}\`
              
              **Result:** No changes were needed - all screenshots are already up to date! 🎉
              
              [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Screenshot update failed!**
              
              **Summary:**
              - **Mode:** \`${{ steps.extract.outputs.mode }}\`
              - **Files processed:** \`${{ steps.extract.outputs.files }}\`
              - **Branch:** \`${{ fromJson(steps.pr.outputs.result).head_ref }}\`
              
              **Error:** The screenshot update process encountered an error.
              
              Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
              
              Common issues:
              - Files not found in the specified pattern
              - Script execution errors
              - Browser automation failures
              
              You can retry by commenting \`/update-screenshots\` again.`
            });

      - name: Add final reaction
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const reaction = '${{ job.status }}' === 'success' ? '+1' : '-1';
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: reaction
            });
